<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <script>
        function greet() {
            console.log("Hello Good Morning! Welcome to JavaScript")
            
        }
        greet()
        console.log("Hi");
        greet()

        // function parameters

        function greetuser(name) {
            console.log("Hello"+name+"!")
        }
        greetuser("ABCDE")
        greetuser("FGHIJ");

        //function return values

        function add(a, b, c)
        {
            return a + b + c;
        }
        let result = add(3, 5, 6);
        console.log(result);

        //function Expression

        const multiply = function (x, y) {
            return x * y;
        }
        console.log(multiply(2, 6));

        //Arrow Functions
        const greets = (name) => "Hello" + name;
        console.log(greets("ABCD"));
            
    </script>

</body>
</html>
