<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <script>
        //increment 
        let a = 10;
        console.log("initial value of a:" + a);//10
        console.log("prefix increment:" + (++a));//11
        console.log("value of a after prefix increment:" + a);//11
        //post increment 
        let b = 20;
        console.log("initial value of b:" + b);//20
        console.log("postfix increment:" + (b++));//20
        console.log("value of b after postfix increment:" + b);//11
        //decrement 
        let c = 30;
        console.log("initial value of a:" + c);//30
        console.log("prefix increment:" + (--c));//29
        console.log("value of a after prefix increment:" + c);//29
        //post decrement 
        let d = 40;
        console.log("initial value of b:" + d);//40
        console.log("postfix increment:" + (d--));//40
        console.log("value of b after postfix increment:" + c);//39


    </script>

</body>
</html>
